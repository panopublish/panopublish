<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 40" width="210" height="40" fill="none">
  <defs>
    <linearGradient id="pano-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- P° Icon Badge -->
  <g transform="translate(2, 4)">
    <rect width="32" height="32" rx="7.5" fill="url(#pano-logo-grad)" />
    <text
      x="16"
      y="22"
      font-family="Georgia, 'Times New Roman', serif"
      font-weight="bold"
      font-size="16.5"
      fill="#FFFFFF"
      text-anchor="middle"
    >P°</text>
  </g>

  <!-- PanoPublish Brand Name -->
  <text
    x="42"
    y="26.5"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="22"
    letter-spacing="-0.5"
  >
    <tspan fill="#0F172A">Pano</tspan><tspan fill="#38BDF8">Publish</tspan>
  </text>
</svg>
